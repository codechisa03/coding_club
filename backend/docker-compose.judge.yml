version: '3.8'

services:
  cache-redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  coding-club-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - REDIS_URL=redis://cache-redis:6379
      - CODE_EXEC_ENABLED=true
    depends_on:
      - cache-redis
    restart: unless-stopped

  coding-club-judge-worker:
    build: .
    command: npm run worker
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://cache-redis:6379
      - MAX_JUDGE_CONCURRENCY=2
    depends_on:
      - cache-redis
    restart: unless-stopped
    # Prevent judge from eating main API CPU
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
